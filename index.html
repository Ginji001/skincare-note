<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6db5">
<meta name="description" content="化粧品の登録、曜日ごとの朝・夜ルーティン、成分の重なりチェックができる無料のスキンケア管理アプリ。データは端末内だけに保存。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="スキンケア">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>スキンケア・ノート</title>
<style>
:root{
  --sky:#eaf2fb; --paper:#ffffff; --ink:#13283f; --sub:#5a6b7e; --line:#cfdcec;
  --blue:#2f6db5; --blue-deep:#1d4f8c; --tint:#d7e6f7; --warn:#a4561a; --warn-bg:#fbeee2;
  --ok:#2f7d5a; --muted:#9aa8b8;
  --bg:var(--sky); --card:var(--paper); --text:var(--ink);
}
:root[data-mode="night"]{
  --bg:#0f2038; --card:#17304f; --text:#e6eef8; --sub:#a9bcd3; --line:#2b4a70;
  --tint:#244874; --blue:#8fb8e8; --blue-deep:#b9d4f3; --warn:#f0b07a; --warn-bg:#3a2c22; --muted:#6f86a3; --ok:#7fd1a8;
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);height:100%}
html{height:100%;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP","Yu Gothic",sans-serif;
  font-size:16px;line-height:1.6;transition:background .35s,color .35s}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px 104px}
header.top{display:flex;align-items:center;justify-content:space-between;padding:6px 0 4px}
header.top h1{font-size:15px;font-weight:700;margin:0;color:var(--sub)}
.iconbtn{background:none;border:0;padding:8px;border-radius:10px;color:var(--sub);font-size:20px;line-height:1}
/* hero */
.hero{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:end;margin:6px 0 14px}
.dow{font-size:88px;font-weight:800;line-height:.9;letter-spacing:-2px;color:var(--blue-deep);grid-row:span 2}
.datenav{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--sub)}
.datenav button{border:1px solid var(--line);background:var(--card);border-radius:999px;width:32px;height:32px}
.datenav .today{width:auto;padding:0 10px;font-size:13px}
.seg{display:inline-flex;background:var(--tint);border-radius:999px;padding:3px;margin-top:6px}
.seg button{border:0;background:none;padding:7px 18px;border-radius:999px;font-weight:700;color:var(--sub)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(20,40,70,.15)}
/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--paper)}
:root[data-mode="night"] .chip[aria-pressed="true"]{color:#0f2038}
.chip small{opacity:.75;margin-left:4px;font-size:11px}
.label{font-size:13px;color:var(--sub);margin:16px 0 4px;font-weight:700}
/* banner */
.banner{border-radius:14px;padding:10px 14px;margin:10px 0;font-size:14px;background:var(--warn-bg);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent)}
.banner b{display:block;font-size:15px}
/* steps */
.progress{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 6px}
.progress h2{margin:0;font-size:18px}
.progress span{font-size:13px;color:var(--sub)}
.bar{height:6px;border-radius:6px;background:var(--tint);overflow:hidden;margin-bottom:10px}
.bar i{display:block;height:100%;background:var(--blue);transition:width .3s}
ol.steps{list-style:none;margin:0;padding:0;counter-reset:s}
ol.steps li{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:8px}
ol.steps li.off{opacity:.55}
ol.steps li.done .nm{text-decoration:line-through;text-decoration-color:var(--muted)}
.chk{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--blue);background:transparent;display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--blue)}
li.done .chk{background:var(--blue);color:var(--card)}
li.off .chk{border-style:dashed;border-color:var(--muted);color:var(--muted)}
.st{flex:1;min-width:0}
.nm{font-weight:700;font-size:16.5px}
.sub{font-size:13px;color:var(--sub)}
.tag{display:inline-block;font-size:11.5px;border-radius:6px;padding:1px 7px;margin:3px 4px 0 0;background:var(--tint);color:var(--blue-deep);font-weight:700}
.tag.w{background:var(--warn-bg);color:var(--warn)}
.slotbox{background:var(--card);border:1px dashed var(--blue);border-radius:16px;padding:10px 12px 4px;margin-bottom:8px}
.slotbox .t{font-size:13px;color:var(--sub);font-weight:700}
.slotbox .chips{margin:6px 0}
.slotbox ol.steps li{border-style:solid;margin-bottom:6px}
.timer{margin-top:6px;display:flex;gap:8px;align-items:center}
.timer button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:3px 12px;font-size:13px}
.timer output{font-variant-numeric:tabular-nums;font-weight:700}
.note{font-size:13.5px;color:var(--sub);background:var(--card);border-left:4px solid var(--blue);border-radius:8px;padding:8px 12px;margin:8px 0}
.memo{width:100%;min-height:64px;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:10px;resize:vertical}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.card h3{margin:0 0 4px;font-size:16px}
details.prod{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px}
details.prod summary{list-style:none;padding:11px 14px;display:flex;justify-content:space-between;gap:8px;align-items:center}
details.prod summary::-webkit-details-marker{display:none}
details.prod .body{padding:0 14px 12px;font-size:14px;white-space:pre-line}
.pname{font-weight:700;font-size:15px}
.badge{flex:none;font-size:11.5px;border-radius:6px;padding:2px 8px;font-weight:700}
.badge.paused{background:var(--warn-bg);color:var(--warn)}
.badge.new{background:var(--tint);color:var(--blue-deep)}
.btn{border:1px solid var(--blue);background:var(--card);color:var(--blue-deep);border-radius:12px;padding:9px 14px;font-weight:700}
.btn.primary{background:var(--blue);color:var(--paper)}
:root[data-mode="night"] .btn.primary{color:#0f2038}
.btn.danger{border-color:var(--warn);color:var(--warn)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
input[type=text],input[type=date],select,textarea.f{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:9px 10px;margin:4px 0 10px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:7px 4px;text-align:left;vertical-align:top}
th{color:var(--sub);font-weight:700;font-size:13px}
.stage{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.stage:last-child{border-bottom:0}
.stage .n{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;border:2px solid var(--line);color:var(--muted)}
.stage.done .n{background:var(--blue);border-color:var(--blue);color:var(--card)}
.stage.cur .n{border-color:var(--blue);color:var(--blue)}
.stage.cur{font-weight:700}
.warnlist li{color:var(--warn)}
/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav.tabs div{display:flex;max-width:560px;width:100%}
nav.tabs button{flex:1;border:0;background:none;padding:9px 0 10px;font-size:12px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button .ic{font-size:19px;line-height:1.1}
nav.tabs button[aria-current="page"]{color:var(--blue-deep);font-weight:700}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:6px 0 12px}
.week button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 0;font-weight:700}
.week button[aria-pressed="true"]{background:var(--blue);color:var(--paper);border-color:var(--blue)}
.cols h4{margin:12px 0 4px;font-size:15px}
.plain{margin:0;padding-left:1.4em}
.plain li{margin:2px 0}
.empty{text-align:center;padding:40px 10px}
.empty h2{font-size:22px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9}
.toast.on{opacity:.95}
.muted{color:var(--muted)}
.ocrbox{border:1px dashed var(--blue);border-radius:12px;padding:10px 12px;margin:10px 0}
.ocrbox .chips .chip{font-size:13px;text-align:left}
.ocrbox textarea{font-size:13px}
.ed{display:flex;gap:4px;flex:none}
.ed button:disabled{opacity:.35}
.ed button{border:1px solid var(--line);background:var(--bg);border-radius:8px;width:30px;height:30px;font-size:14px;color:var(--sub)}
.warnbox{border-radius:12px;padding:8px 12px;margin:8px 0;font-size:13.5px}
.warnbox.w{background:var(--warn-bg);color:var(--warn)}
.warnbox.i{background:var(--tint);color:var(--blue-deep)}
dialog{border:0;border-radius:18px;padding:16px;max-width:520px;width:calc(100% - 24px);background:var(--card);color:var(--text)}
dialog::backdrop{background:rgba(10,25,45,.45)}
.list-pick button{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px;margin:6px 0}
.disc{font-size:12px;color:var(--sub);margin-top:18px;line-height:1.6}
.ocrbox{border:1px dashed var(--blue);border-radius:12px;padding:10px 12px;margin:10px 0}
.ocrbox .chips .chip{font-size:13px;text-align:left}
.ocrbox textarea{font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div class="wrap" id="app"></div>
<nav class="tabs" id="tabs"><div>
  <button data-tab="today"><span class="ic">◐</span>今日</button>
  <button data-tab="week"><span class="ic">▦</span>ルーティン</button>
  <button data-tab="prod"><span class="ic">≡</span>製品</button>
  <button data-tab="set"><span class="ic">⚙</span>設定</button>
</div></nav>
<dialog id="dlg"></dialog>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="ocrfile" accept="image/*" multiple style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0" aria-label="製品の写真">
<input type="file" id="file" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0" aria-label="バックアップファイル">
<script>
'use strict';
const LS='skincare-note-v1';
const DK=['sun','mon','tue','wed','thu','fri','sat'];
const DJ=['日','月','火','水','木','金','土'];
const ORDER=[1,2,3,4,5,6,0];
const PJ={am:'朝',pm:'夜'};
const CATS=['クレンジング・洗顔','化粧水','美容液','マスク','乳液・クリーム','日焼け止め','医薬品・処方薬','その他'];
const TAGS={retinoid:'ビタミンA系',acid:'酸（AHA/BHA/PHA）',bpo:'過酸化ベンゾイル',vitc:'ビタミンC',niacinamide:'ナイアシンアミド',fragrance:'香料・精油',exfoliant:'スクラブ・ピーリング'};
const KW={
  retinoid:['レチノール','レチナール','レチニル','レチノイン','トレチノイン','アダパレン','ヒドロキシピナコロン','retinol','retinal','retinyl','adapalene','tretinoin','hydroxypinacolone'],
  acid:['サリチル酸','グリコール酸','乳酸','マンデル酸','リンゴ酸','グルコノラクトン','ラクトビオン酸','salicylic','glycolic','lactic acid','mandelic','gluconolactone','lactobionic'],
  bpo:['過酸化ベンゾイル','benzoyl peroxide'],
  vitc:['アスコルビン酸','アスコルビル','アスコルビン','ascorb'],
  niacinamide:['ナイアシンアミド','niacinamide'],
  fragrance:['香料','リナロール','リモネン','シトロネロール','ゲラニオール','オイゲノール','ラベンダー油','fragrance','parfum','linalool','limonene'],
  exfoliant:['スクラブ','ピーリング','パパイン','プロテアーゼ'],
};
function blank(){return{ver:1,products:{},routines:{am:{},pm:{}},flags:{},log:{},memo:{},started:false}}
function load(){try{const s=JSON.parse(localStorage.getItem(LS));if(s&&s.products)return s}catch(e){}return blank()}
function save(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){toast('保存できませんでした（容量や設定を確認してください）')}}
let S=load();
function todayKey(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function parse(k){const[a,b,c]=k.split('-').map(Number);return new Date(a,b-1,c)}
function addDays(k,n){const d=parse(k);d.setDate(d.getDate()+n);return todayKey(d)}
function fmtDate(k){const d=parse(k);return(d.getMonth()+1)+'月'+d.getDate()+'日'}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),1800)}
let view={tab:'today',date:todayKey(),mode:new Date().getHours()>=15||new Date().getHours()<4?'pm':'am',wday:DK[new Date().getDay()],wmode:'am',np:null,ocr:null};
const timers={};

/* ---------- 成分 ---------- */
function autoTags(ing){const t=(ing||'').toLowerCase();return Object.keys(KW).filter(k=>KW[k].some(w=>t.includes(w.toLowerCase())))}
function tagsOf(p){return[...new Set([...(p.tags||[]),...(p.manualTags||[])])]}
function routineWarnings(steps,period){
  const ps=steps.map(s=>s.p&&S.products[s.p]).filter(p=>p&&p.status==='active');
  const cnt=k=>ps.filter(p=>tagsOf(p).includes(k)).length;
  const out=[];
  if(cnt('retinoid')>=2)out.push(['w','ビタミンA系が'+cnt('retinoid')+'品重なっています。刺激が出やすいとされる組み合わせです。']);
  if(cnt('retinoid')&&cnt('acid'))out.push(['w','ビタミンA系と酸（AHA/BHA/PHA）を同じ時間に使っています。刺激が出やすいとされる組み合わせです。']);
  if(cnt('retinoid')&&cnt('bpo'))out.push(['w','ビタミンA系と過酸化ベンゾイルを同じ時間に使っています。製品・処方の指示を確認してください。']);
  if(cnt('acid')>=2)out.push(['w','酸（AHA/BHA/PHA）を含む製品が'+cnt('acid')+'品あります。']);
  if(cnt('exfoliant')&&(cnt('retinoid')||cnt('acid')))out.push(['w','スクラブ・ピーリングと、ビタミンA系または酸を同じ時間に使っています。']);
  if(cnt('niacinamide')>=3)out.push(['i','ナイアシンアミドを含む製品が'+cnt('niacinamide')+'品あります（問題とは限りませんが、重なりの目安に）。']);
  if(ps.some(p=>p.cat==='医薬品・処方薬'))out.push(['i','医薬品・処方薬は、医師・薬剤師の指示や添付文書を優先してください。']);
  if(period==='am'&&ps.length&&!ps.some(p=>p.cat==='日焼け止め'))out.push(['i','朝のルーティンに日焼け止めがありません。']);
  if(period==='am'&&cnt('retinoid'))out.push(['i','朝にビタミンA系を使っています。製品の使用時間の指示を確認してください。']);
  if(period==='pm'&&ps.some(p=>p.cat==='日焼け止め'))out.push(['i','夜のルーティンに日焼け止めが入っています。']);
  return out;
}
function warnHtml(ws){return ws.map(w=>'<div class="warnbox '+w[0]+'">'+esc(w[1])+'</div>').join('')}

/* ---------- ルーティン解決 ---------- */
function stepsFor(period,dk){return(S.routines[period]||{})[dk]||[]}
function resolve(date,period){
  const dk=DK[parse(date).getDay()],sens=S.flags.sensitive===date,out=[],hidden=[];
  for(const st of stepsFor(period,dk)){
    if(!st.p){out.push({key:st.id,label:st.label,state:'normal',tags:[],timer:st.timer});continue}
    const p=S.products[st.p];if(!p||p.status==='removed')continue;
    if(p.status==='paused'){hidden.push(p.name);continue}
    const it={key:st.id,label:p.name,state:'normal',tags:[],sub:st.note||''};
    if(sens&&p.sensitive){it.state='optional';it.tags.push(['敏感な日：休む候補',1])}
    out.push(it);
  }
  return{steps:out,hidden,sens,dk};
}

/* ---------- 画面 ---------- */
function render(){
  document.documentElement.dataset.mode=(view.tab==='today'&&view.mode==='pm')?'night':'day';
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===view.tab?'page':'false'));
  const app=document.getElementById('app');
  app.innerHTML='<header class="top"><h1>スキンケア・ノート</h1></header>'+({today,week,prod:prodView,set:settings})[view.tab]();
  for(const k in timers)paintTimer(k);
}
function today(){
  if(!Object.keys(S.products).length&&!S.started)return welcome();
  const date=view.date,period=view.mode,r=resolve(date,period);
  const done=new Set(((S.log[date]||{})[period])||[]);
  const req=r.steps.filter(s=>s.state==='normal'),got=req.filter(s=>done.has(s.key)).length;
  let h='<section class="hero"><div class="dow" aria-hidden="true">'+DJ[parse(date).getDay()]+'</div>'+
    '<div class="datenav"><button data-act="day" data-n="-1" aria-label="前の日">‹</button><span>'+fmtDate(date)+'（'+DJ[parse(date).getDay()]+'）</span><button data-act="day" data-n="1" aria-label="次の日">›</button>'+(date===todayKey()?'':'<button class="today" data-act="day" data-n="0">今日</button>')+'</div>'+
    '<div><div class="seg" role="group" aria-label="朝夜"><button data-act="mode" data-m="am" aria-pressed="'+(period==='am')+'">朝</button><button data-act="mode" data-m="pm" aria-pressed="'+(period==='pm')+'">夜</button></div></div></section>';
  h+='<div class="chips"><button class="chip" data-act="sens" aria-pressed="'+r.sens+'">肌が敏感な日<small>この日だけ</small></button></div>';
  if(r.sens)h+='<div class="sub">「刺激が強め」にした製品を休む候補として表示しています。</div>';
  h+='<div class="progress"><h2>'+PJ[period]+'のケア</h2><span>'+got+' / '+req.length+'</span></div><div class="bar"><i style="width:'+(req.length?got/req.length*100:0)+'%"></i></div>';
  if(!r.steps.length)h+='<div class="card"><h3>'+DJ[parse(date).getDay()]+'曜日の'+PJ[period]+'はまだ空です</h3><div class="sub">ルーティンのタブで手順を追加します。</div><div class="row"><button class="btn primary" data-act="goedit">この曜日の'+PJ[period]+'を作る</button></div></div>';
  else{
    h+='<ol class="steps">'+r.steps.map((s,i)=>{const d=done.has(s.key);return'<li class="'+(d?'done':'')+'"><button class="chk" data-act="check" data-key="'+esc(s.key)+'" aria-label="'+esc(s.label)+'を完了">'+(d?'✓':i+1)+'</button><div class="st"><div class="nm">'+esc(s.label)+'</div>'+(s.sub?'<div class="sub">'+esc(s.sub)+'</div>':'')+s.tags.map(t=>'<span class="tag'+(t[1]?' w':'')+'">'+esc(t[0])+'</span>').join('')+
      (s.timer?'<div class="timer"><button data-act="timer" data-key="'+esc(s.key)+'">'+(timers[s.key]?.run?'止める':'待ち時間を計る')+'</button><output id="t-'+esc(s.key)+'">0:00</output></div>':'')+'</div></li>'}).join('')+'</ol>';
    h+=warnHtml(routineWarnings(stepsFor(period,r.dk),period));
  }
  if(r.hidden.length)h+='<div class="note">休止中で外しているもの：'+esc(r.hidden.join('、'))+'</div>';

const OCR_BASE=new URL('vendor/ocr/',location.href).href;
let ocrWorker=null,ocrBusy=false;
function ocrBox(){
  const o=view.ocr;
  let h='<div class="ocrbox"><div class="row" style="margin-top:0;align-items:center"><label class="btn" for="ocrfile" role="button">写真から読み取る</label><span class="sub" id="ocr-st">'+esc(o?.status||'')+'</span></div>'+

  if(o&&o.lines&&o.lines.length){
    h+='<div class="label" style="margin-top:10px">製品名に使う行をタップ</div><div class="chips">'+o.lines.map((l,i)=>'<button class="chip" data-act="ocrname" data-i="'+i+'">'+esc(l)+'</button>').join('')+'</div>';
    h+='<div class="row"><button class="btn sm" data-act="ocring">'+(o.ing?'全成分の部分を全成分欄に入れる':'読み取った文字を全部、全成分欄に入れる')+'</button><button class="btn sm" data-act="ocrclear">読み取り結果を消す</button></div>';
    h+='<details style="margin-top:8px"><summary class="sub">読み取った文字をすべて見る</summary><textarea class="f" rows="6" readonly>'+esc(o.text)+'</textarea></details>';
  }
  return h+'</div>';
}
function setOcrStatus(t){if(view.ocr)view.ocr.status=t;const e=document.getElementById('ocr-st');if(e)e.textContent=t}
function loadScript(src){return new Promise((ok,ng)=>{if(window.Tesseract)return ok();const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>ng(new Error('読み取り機能を読み込めません（初回はネット接続が必要）'));document.head.appendChild(s)})}
async function prepImage(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((ok,ng)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>ng(new Error('画像を開けません'));i.src=url});
    const max=2200,sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*sc);c.height=Math.round(img.naturalHeight*sc);
    const x=c.getContext('2d');x.filter='grayscale(1) contrast(1.2)';x.drawImage(img,0,0,c.width,c.height);
    return c;
  }finally{URL.revokeObjectURL(url)}
}
function cleanOcr(t){
  const J='[\\u3000-\\u30ff\\u3400-\\u9fff\\uf900-\\ufaff\\uff00-\\uffef]';
  const re=new RegExp('('+J+')[ \\t]+(?='+J+')','g');
  return t.split('\n').map(l=>l.replace(re,'$1').replace(re,'$1').replace(/[ \t]+/g,' ').trim()).filter(Boolean).join('\n');
}
function extractIngredients(t){
  const m=t.match(/全成分|成\s*分\s*[:：]|INGREDIENTS?/i);if(!m)return'';
  let rest=t.slice(m.index+m[0].length).replace(/^[\s:：】\]]+/,'');
  const stop=rest.search(/(使用方法|使い方|ご使用|ご注意|使用上の注意|注意|内容量|容量|製造販売|販売元|発売元|輸入|原産国|お問い?合わせ|お客様|用法|保管)/);
  if(stop>0)rest=rest.slice(0,stop);
  return rest.replace(/\n+/g,'').replace(/[,，]/g,'、').replace(/[\s【\[（(、]+$/,'').trim();
}
async function runOcr(files){
  if(ocrBusy)return;ocrBusy=true;
  view.ocr={status:'準備中…（初回は読み取り用データを取得します）',lines:[],text:'',ing:''};render();
  try{
    await loadScript(OCR_BASE+'tesseract.min.js');
    if(!ocrWorker){
      ocrWorker=await Tesseract.createWorker(['jpn','eng'],1,{workerPath:OCR_BASE+'worker.min.js',corePath:OCR_BASE+'core',langPath:OCR_BASE+'lang',
        logger:m=>{if(m.status==='recognizing text')setOcrStatus('読み取り中 '+Math.round((m.progress||0)*100)+'%');else if(/load|init/.test(m.status||''))setOcrStatus('準備中…')}});
    }
    const texts=[];
    for(let i=0;i<files.length;i++){
      setOcrStatus((files.length>1?(i+1)+'/'+files.length+'枚目 ':'')+'読み取り中…');
      const c=await prepImage(files[i]);
      const r=await ocrWorker.recognize(c);
      texts.push(cleanOcr(r.data.text||''));
    }
    const text=texts.join('\n');
    const lines=[...new Set(texts.flatMap(t=>t.split('\n')).filter(l=>l.length>=2&&l.length<=40&&!/全成分|成分[:：]/.test(l)))].slice(0,16);
    view.ocr={status:text?'読み取りました':'文字が見つかりませんでした',lines,text,ing:extractIngredients(text)};
  }catch(e){view.ocr={status:'読み取れませんでした：'+e.message,lines:[],text:'',ing:''}}
  ocrBusy=false;render();
}
document.getElementById('ocrfile').addEventListener('change',e=>{const fs=[...(e.target.files||[])];e.target.value='';if(fs.length)runOcr(fs)});

  case'newp':view.np={name:'',cat:'化粧水',ing:'',memo:'',manualTags:[],sensitive:false};view.ocr=null;render();scrollTo(0,0);break;
  case'editp':{const p=S.products[b.dataset.id];view.np={id:b.dataset.id,name:p.name,cat:p.cat,ing:p.ing||'',memo:p.memo||'',manualTags:[...(p.manualTags||[])],sensitive:!!p.sensitive};view.ocr=null;render();scrollTo(0,0);break}
  case'mtag':{readForm();const k=b.dataset.k,m=view.np.manualTags;m.includes(k)?m.splice(m.indexOf(k),1):m.push(k);render();break}
  case'sensp':readForm();view.np.sensitive=!view.np.sensitive;render();break;
  case'savep':{readForm();const n=view.np;if(!n.name.trim()){toast('製品名を入れてください');break}
    const id=n.id||uid(),old=S.products[id]||{status:'active'};
    S.products[id]={...old,name:n.name.trim(),cat:n.cat,ing:n.ing.trim(),memo:n.memo.trim(),tags:autoTags(n.ing),manualTags:n.manualTags,sensitive:n.sensitive};
    const t=tagsOf(S.products[id]);view.np=null;view.ocr=null;save();render();
    toast(n.id?'保存しました':'追加しました');
    if(t.includes('retinoid')||t.includes('acid')||t.includes('bpo'))setTimeout(()=>toast('刺激が出やすいとされる成分を含みます。組み合わせ注意を確認してください'),1900);
    break}
  case'cancelp':view.np=null;view.ocr=null;render();break;
  case'pstat':{const p=S.products[b.dataset.id],s=b.dataset.s;if(s==='removed'){if(!confirm(p.name+'を削除しますか？ルーティンからも外れます。'))break;for(const pp of['am','pm'])for(const k in S.routines[pp])S.routines[pp][k]=S.routines[pp][k].filter(x=>x.p!==b.dataset.id);delete S.products[b.dataset.id]}else p.status=s;save();render();toast(s==='active'?'再開しました':s==='paused'?'休止しました':'削除しました');break}
  case'ocrname':{readForm();const l=view.ocr.lines[+b.dataset.i];view.np.name=view.np.name?view.np.name+' '+l:l;render();break}
  case'ocring':{readForm();const t=view.ocr.ing||view.ocr.text.replace(/\n+/g,'');view.np.ing=view.np.ing?view.np.ing+'、'+t:t;render();break}
  case'ocrclear':readForm();view.ocr=null;render();break;
  case'export':exportAll();break;
  case'reset':if(!confirm('すべてのデータを消しますか？元に戻せません。'))break;S=blank();save();view.tab='today';render();break;
  }
});
document.addEventListener('input',e=>{if(e.target.dataset.act==='memo'){S.memo[view.date]=e.target.value;save()}if(e.target.id==='np-ing'&&view.np){view.np.ing=e.target.value}});
document.addEventListener('change',e=>{if(e.target.id==='np-cat'&&view.np){readForm();render()}if(e.target.id==='np-ing'&&view.np){readForm();render()}});
render();
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
